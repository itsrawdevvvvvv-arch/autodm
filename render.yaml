services:
  - type: web
    name: viraloop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_URL
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: LOGIN_ROUTE
        value: instagram
      - key: WEBHOOK_VERIFY_TOKEN
        generateValue: true
      # Locks the dashboard so only you can edit automations.
      # Copy the generated value into the dashboard's Settings panel.
      - key: APP_KEY
        generateValue: true
